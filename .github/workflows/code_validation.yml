# コードバリデーションワークフロー
name: code_validation
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# PR trigger で依存を取得して実行するため、job 内に write 権限のトークンを置かない。
# PR への書き込みは、PR のコードを動かさない eval-comment だけが App のトークンで行う
permissions:
  contents: read

# macOS のジョブが使う Xcode。ランナーのイメージ（macos-26）とともに版を固定する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # 配布物の組み立てと、変換の精度の測定に関わるファイルが変わったかを調べる。
  # テストは変更の内容に関わらず常に走らせ、ここの結果で止めない
  # ==============================================================
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dist: ${{ steps.dist.outputs.any_modified }}
      eval: ${{ steps.eval.outputs.any_modified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changed-files は PR の base と head を merge base で比べるので、全履歴を取る
          fetch-depth: 0
          filter: blob:none
          show-progress: false

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: dist
        with:
          files: |
            scripts/**
            mise.toml
            mise.lock
            bunfig.toml
            .github/actions/**
            App/**
            Package.swift
            Package.resolved
            Sources/TugimeIME/**
            Sources/TugimeEngine/**
            Sources/TugimeCore/Resources/**
            Sources/SystemDictionaryLayout/**
            Sources/tugime-dictionary/**
            .github/workflows/**
          skip_initial_fetch: true
          # 差分を取れなかったときに「変更なし」と同じ結果を返させない
          fail_on_initial_diff_error: true

      # 精度の結果を変えうるもの。tugime-eval が読むコードと辞書、問題集と辞書の取得、道具の版、測り方
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: eval
        with:
          files: |
            Sources/TugimeCore/**
            Sources/TugimeEngine/**
            Sources/TugimeEval/**
            Sources/tugime-eval/**
            Sources/SystemDictionaryLayout/**
            Sources/tugime-dictionary/**
            Package.swift
            Package.resolved
            scripts/fetch-dictionary.ts
            scripts/fetch-eval.ts
            scripts/lib/**
            mise.toml
            mise.lock
            .github/actions/**
            .github/workflows/code_validation.yml
          skip_initial_fetch: true
          fail_on_initial_diff_error: true

  # ==============================================================
  # テスト（macOS 専用の IME なので macOS で走らせる）
  # ==============================================================
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: $/.github/actions/setup-environment

      # テストは本物のシステム辞書で変換する
      - name: Build system dictionary
        run: bun scripts/fetch-dictionary.ts

      - name: Test
        run: swift test

  # ==============================================================
  # 変換の精度。PR と base の両方で問題集を解き、片方だけが正解した問題を PR にコメントする。PR を止めないので all-green に入れない。
  # 測れなかったときは、このジョブのチェックが赤になる。このジョブは PR のコードを動かすので、書き込みの権限を持たず、結果を成果物に残すだけにする。
  # 精度の結果を変えうるファイルが変わらない PR では、base と同じ結果になるので測らない
  # ==============================================================
  eval:
    needs: changes
    if: needs.changes.outputs.eval == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        # パイプの途中の失敗を、そのステップの失敗にする
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          # base は合成マージの第 1 親。この PR を足す前の木なので、スタックの上の層でも、この PR が足した差だけを比べる
          fetch-depth: 2

      - uses: $/.github/actions/setup-environment

      - name: Check out base
        run: git worktree add "$RUNNER_TEMP/base" HEAD^1

      - name: Fetch problems
        run: |
          problems=$(bun scripts/fetch-eval.ts)
          echo "PROBLEMS=$problems" >> "$GITHUB_ENV"

      - name: Build system dictionary (head)
        run: bun scripts/fetch-dictionary.ts

      # 辞書の組み立てに関わるファイルが同じなら、head の辞書を写す。違えば base の版で組み立てる
      - name: Build system dictionary (base)
        run: |
          sources=$(bun scripts/fetch-dictionary.ts --compare-sources HEAD^1)
          if [ "$sources" = same ]; then
            mkdir -p "$RUNNER_TEMP/base/.dictionary"
            cp .dictionary/tugime-dictionary.bin "$RUNNER_TEMP/base/.dictionary/"
          else
            bun "$RUNNER_TEMP/base/scripts/fetch-dictionary.ts"
          fi

      - name: Build tugime-eval (head)
        run: swift build -c release --product tugime-eval

      - name: Accuracy (head)
        run: .build/release/tugime-eval accuracy --method lattice --problems "$PROBLEMS" --out "$RUNNER_TEMP/head.jsonl"

      - name: Build tugime-eval (base)
        run: swift build -c release --product tugime-eval --package-path "$RUNNER_TEMP/base"

      # base の道具は base の辞書を、base の直下から読む
      - name: Accuracy (base)
        working-directory: ${{ runner.temp }}/base
        run: .build/release/tugime-eval accuracy --method lattice --problems "$PROBLEMS" --out "$RUNNER_TEMP/base.jsonl"

      - name: Report
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          {
            echo "## 変換の精度（lattice）"
            echo
            .build/release/tugime-eval compare --markdown "$RUNNER_TEMP/base.jsonl" "$RUNNER_TEMP/head.jsonl"
          } > "$RUNNER_TEMP/report/comment.md"
          cat "$RUNNER_TEMP/report/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: ${{ runner.temp }}/report/comment.md

  # 精度の結果を PR にコメントする。PR のコードを取り出さず、成果物の文章だけを本文として書く。
  # 書き込みは App の短命なトークンで行い、GITHUB_TOKEN は読み取りのまま
  eval-comment:
    needs: eval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-report

      # 必要な権限をコードで宣言する。PR へのコメントは pull-requests:write で書ける
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # App が書いた最後のコメントを書き換え、無ければ作る。PR ごとに 1 つのコメントにする
      - name: Comment
        run: gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none --body-file comment.md
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  # ==============================================================
  # scripts の TypeScript の型と整形
  # ==============================================================
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: $/.github/actions/setup-environment

      - name: Install dependencies
        run: bun install --cwd scripts --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd scripts typecheck

      - name: Format
        run: bun run --cwd scripts format:check

  # ==============================================================
  # 配布物の組み立て（リソースの同梱・Info.plist・署名）が壊れていないかを、release より前に検知する
  # ==============================================================
  app:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: $/.github/actions/setup-environment

      - name: Build .app
        run: TUGIME_BUILD_CHANNEL=stable bun scripts/build-app.ts

      # 利用者の Mac と同じく、組み立てたディレクトリが無い状態で辞書・表示の変換のモデル・llama.framework を読めるか。
      # 実行ファイルと llama.framework が arm64 だけか。
      # ランナーの GPU は仮想なので、PR では Metal のデバイスを 0 にして CPU で変換する。Metal の経路はリリースの Check .app が通す
      # ref: llama.cpp ggml/src/ggml-metal/ggml-metal.cpp の GGML_METAL_DEVICES
      - name: Check .app
        env:
          GGML_METAL_DEVICES: "0"
        run: bun scripts/check-app.ts dist/tugime.app

  # ==============================================================
  # workflow のセキュリティ検査
  # ==============================================================
  workflow_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 非公開のリポジトリは checkout に読み取りの権限が要る
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  # ==============================================================
  # CI 全体のステータス集約。main の ruleset ではこのジョブだけを必須にする
  # ==============================================================
  all-green:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      # changes は常に走る。失敗したら app が飛ばされるので、allowed-skips に入れずに失敗を拾う
      - changes
      - test
      - scripts
      - app
      - workflow_audit
    steps:
      - name: Check all CI jobs status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # app は配布物の組み立てに関わる変更が無ければ飛ばす
          allowed-skips: app
