# コードバリデーションワークフロー
name: code_validation
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# PR trigger で依存を取得して実行するため、job 内に write 権限のトークンを置かない
permissions:
  contents: read

# macOS のジョブが使う Xcode。ランナーのイメージ（macos-26）とともに版を固定する
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================
  # 配布物の組み立てに関わるファイルが変わったかを調べる。
  # テストは変更の内容に関わらず常に走らせ、ここの結果で止めない
  # ==============================================================
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dist: ${{ steps.dist.outputs.any_modified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # changed-files は PR の base と head を merge base で比べるので、全履歴を取る
          fetch-depth: 0
          filter: blob:none
          show-progress: false

      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: dist
        with:
          files: |
            scripts/**
            mise.toml
            mise.lock
            .github/actions/**
            App/**
            Package.swift
            Package.resolved
            Sources/TugimeIME/**
            Sources/TugimeCore/Resources/**
            .github/workflows/**
          skip_initial_fetch: true
          # 差分を取れなかったときに「変更なし」と同じ結果を返させない
          fail_on_initial_diff_error: true

  # ==============================================================
  # テスト（macOS 専用の IME なので macOS で走らせる）
  # ==============================================================
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Test
        run: swift test

  # ==============================================================
  # scripts の TypeScript の型と整形
  # ==============================================================
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: $/.github/actions/setup-environment

      - name: Install dependencies
        run: bun install --cwd scripts --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd scripts typecheck

      - name: Format
        run: bun run --cwd scripts format:check

  # ==============================================================
  # 配布物の組み立て（リソースの同梱・Info.plist・署名）が壊れていないかを、release より前に検知する
  # ==============================================================
  app:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - uses: $/.github/actions/setup-environment

      - name: Build .app
        run: TUGIME_BUILD_CHANNEL=stable bun --no-install scripts/build-app.ts

      # 利用者の Mac と同じく、組み立てたディレクトリが無い状態で辞書・表示の変換のモデル・llama.framework を読めるか。
      # 実行ファイルと llama.framework が arm64 だけか
      - name: Check .app
        run: bun --no-install scripts/check-app.ts dist/tugime.app

  # ==============================================================
  # workflow のセキュリティ検査
  # ==============================================================
  workflow_audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 非公開のリポジトリは checkout に読み取りの権限が要る
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  # ==============================================================
  # CI 全体のステータス集約。main の ruleset ではこのジョブだけを必須にする
  # ==============================================================
  all-green:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      # changes は常に走る。失敗したら app が飛ばされるので、allowed-skips に入れずに失敗を拾う
      - changes
      - test
      - scripts
      - app
      - workflow_audit
    steps:
      - name: Check all CI jobs status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # app は配布物の組み立てに関わる変更が無ければ飛ばす
          allowed-skips: app
