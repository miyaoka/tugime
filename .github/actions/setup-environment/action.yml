name: "Setup Environment"
description: "mise.toml の道具を mise.lock の checksum で確かめて入れ、scripts の依存を入れる"

runs:
  using: "composite"
  steps:
    # mise は版を固定し、mise.lock の形式が mise の更新で変わらないようにする。
    # mise.lock があると mise install --locked になり、bun の zip を commit 済みの checksum と照合する。
    # キャッシュは使わない。ほかの実行が書いたキャッシュを配布物を作るジョブに入れないため
    - name: Set up by mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      env:
        # pull_request で PR 由来の mise.toml を読むため、config の実行経路（hooks / exec template / plugin script）を封じる
        MISE_SAFE: "1"
      with:
        version: 2026.10.19
        install: true
        cache: false

    - name: Install dependencies
      shell: bash
      run: bun install --cwd scripts --frozen-lockfile
