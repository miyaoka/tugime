name: "Setup Environment"
description: "mise.toml の道具を mise.lock の checksum で確かめて入れ、scripts の依存を入れる"

runs:
  using: "composite"
  steps:
    # mise の版を固定する。mise.lock の形式は mise の版で変わる。
    # キャッシュは使わない。配布物を作るジョブにも、ほかの実行が書いたキャッシュを入れない
    - name: Set up by mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      env:
        # pull_request で PR 由来の mise.toml を読む
        MISE_SAFE: "1"
      with:
        version: 2026.10.19
        install: true
        cache: false

    - name: Install dependencies
      shell: bash
      run: bun install --cwd scripts --frozen-lockfile
