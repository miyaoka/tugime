# scripts/convert-hf-to-gguf.sh が取得と変換に使う Python の環境。uv.lock がハッシュまで固定し、スクリプトは --locked で使う
[project]
name = "tugime-convert-env"
version = "0"
requires-python = "==3.11.*"
# torch・numpy・sentencepiece・transformers・protobuf は llama.cpp b4846 の変換が動いた組み合わせ。
# huggingface_hub は transformers 4.x が受け付ける 1.0 未満で、hf download がある版
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "sentencepiece==0.2.0",
    "transformers>=4.45.1,<5",
    "protobuf<5",
    "huggingface_hub>=0.34,<1",
]

[tool.uv]
package = false
